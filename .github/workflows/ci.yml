name: MaltaShop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maltashop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Business rules and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned dependency
        run: python -m pip install -r requirements.txt
      - name: Compile application and verification scripts
        run: python -m compileall -q app scripts tests
      - name: Run unit, saga, contract and local HTTP tests
        run: python -m unittest discover -v 2>&1 | tee test-results.log
      - name: Preserve actual test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ github.sha }}
          path: test-results.log
          retention-days: 7
          if-no-files-found: warn

  integration:
    name: Build once and verify live services
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_TAG: ${{ github.sha }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build each service once and record its image ID
        run: |
          for service in order inventory payment notification; do
            docker build --target runtime \
              --label "org.opencontainers.image.revision=$BUILD_TAG" \
              -f "services/$service/Dockerfile" \
              -t "maltashop-ci-$service:$BUILD_TAG" .
          done
          python3 -m scripts.release_manifest
      - name: Verify the same images without rebuilding
        run: |
          mkdir -p ci-results
          bash scripts/ci-integration.sh 2>&1 | tee ci-results/integration.log
      - name: Preserve service status and structured logs
        if: always()
        run: |
          mkdir -p ci-results
          docker compose -f compose.yaml -f compose.ci.yaml ps -a > ci-results/containers.txt || true
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color > ci-results/service-logs.txt 2>&1 || true
      - name: Upload verification evidence and manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ github.sha }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: error
      - name: Remove ephemeral CI containers and test volumes
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v --remove-orphans

  candidate:
    name: Release candidate verified
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve the manifest from this successful workflow run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: verification-${{ github.sha }}
          path: verification
      - name: Confirm candidate revision and document delivery boundary
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          manifest=json.loads(Path('verification/release-manifest.json').read_text())
          if manifest['source_revision'] != os.environ['EXPECTED_REVISION']:
              raise SystemExit('Source revision mismatch')
          if {image['service'] for image in manifest['images']} != {'order','inventory','payment','notification'}:
              raise SystemExit('Missing service image')
          if manifest['production_deployed']:
              raise SystemExit('Prototype must not claim an actual production deployment')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Verified release candidate\n\n')
              summary.write('Business rules, service contract, live messaging, restart recovery and broker-outage isolation passed.\n\n')
              summary.write('Source revision: `' + manifest['source_revision'] + '`\n\n')
              summary.write('Production deployment is proposed, not executed. A registry, deployment target and approved release process remain prerequisites.\n')
          PY
